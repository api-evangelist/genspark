name: Genspark
description: >-
  Genspark is an all-in-one AI workspace and autonomous "Super Agent" platform that plans
  and executes multi-step tasks on a user's behalf. It bundles a suite of AI agent tools —
  deep research, AI slides, AI sheets, AI docs, AI chat, a "Call For Me" voice agent, and a
  built-in AI browser — into a single natural-language workspace, alongside companion
  products such as Genspark Claw, Speakly, GenClipboard, and GenTerminal and native iOS and
  Android apps. For developers and agents, Genspark operates a hosted, remote Model Context
  Protocol (MCP) server at /api/mcp that exposes its tools, resources, and prompts over HTTP,
  gated by OAuth 2.1 (authorization_code with PKCE, refresh tokens, and dynamic client
  registration). Genspark is backed by Emergence Capital.
